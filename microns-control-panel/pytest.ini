# See the engine's pytest.ini for why this is here.
#
# This suite currently resolves `app` through tests/__init__.py, which makes
# pytest insert this directory as the test package's parent. That is incidental
# — deleting that file would break the suite in a way with no obvious
# connection to it. Stating the path explicitly removes the coupling.
[pytest]
pythonpath = .
testpaths = tests
