# The suite imports the application as `app`, which needs this directory on
# sys.path.
#
# `python -m pytest` adds the current directory implicitly and a bare `pytest`
# does not, so without this the command a contributor types and the command CI
# runs behave differently — and CI is the one that fails, with a
# ModuleNotFoundError that says nothing about the cause. Setting it here makes
# both invocations work the same way.
[pytest]
pythonpath = .
testpaths = tests
